<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Demo Page — AccessLens AI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #111827;
      background-color: #ffffff;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #111827;
      font-size: 28px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #111827;
    }
    input {
      padding: 8px 12px;
      border: 1px solid #4b5563;
      border-radius: 4px;
      font-size: 16px;
      color: #111827;
      background-color: #ffffff;
    }
    button {
      background-color: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Accessible Demo Portal</h1>
  </header>
  <main>
    <section>
      <h2>Customer Feedback</h2>
      <p>Please enter your contact details below to receive service status updates.</p>
      <form action="/submit" method="post">
        <div>
          <label for="full-name">Full Name</label>
          <input id="full-name" type="text" name="fullname" autocomplete="name">
        </div>
        <div style="margin-top: 12px;">
          <label for="contact-email">Email Address</label>
          <input id="contact-email" type="email" name="email" autocomplete="email">
        </div>
        <div>
          <button type="submit">Submit Feedback</button>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 AccessLens AI Verification Suite.</p>
  </footer>
</body>
</html>
