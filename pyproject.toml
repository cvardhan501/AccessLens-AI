[project]
name = "accesslens-ai"
version = "0.2.0"
description = "Civic Access Auditor governed by Strands Decider 2B policy gatekeeping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "strands-agents>=1.60.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "accesslens.server:app"
